paths:
  data_root: ../data
  checkpoint_root: ../data/checkpoints
  perceptual_root: ../data/perceptual
  artifact_root: ../results/artifacts
  split_manifest: assets/pet37_ei_cpu_splits.json
  vf_artifact: ../results/artifacts/vf/vf_first_pass.json
  plot_root: ../results/plots
  analysis_root: ../results/analysis
  run_root: ../results/runs
runtime:
  device: cpu
  num_workers: 0
  deterministic: true
  seed: 42
data:
  image_size: 224
  train_batch_size: 8
  eval_batch_size: 8
  train_subset_size: null
  val_subset_size: null
  calibration_size: 32
  evaluation_size: 128
  validation_fraction: 0.1
  download: false
  image_mean:
  - 0.485
  - 0.456
  - 0.406
  image_std:
  - 0.229
  - 0.224
  - 0.225
models:
  num_classes: 37
  source:
  - name: resnet18
    weight: 1.0
  targets:
  - mobilenet_v2
  all:
  - resnet18
  - mobilenet_v2
training:
  epochs: 2
  learning_rate: 0.001
  weight_decay: 1.0e-05
  label_smoothing: 0.0
  freeze_backbone: true
  early_stopping_patience: 0
  checkpoint_metric: val_accuracy
  grad_clip_norm: 1.0
  mixed_precision: false
attack:
  epsilon: 0.03137254901960784
  alpha: 0.006274509803921569
  steps: 6
  momentum: 0.9
  di_prob: 0.7
  di_scale_min: 0.8
  di_scale_max: 1.2
  ti_kernel_size: 3
  ti_sigma: 3.0
  eot_neighbor_span: 5
  eot_samples: 3
  teacher_eot_samples: 6
  batch_size: 4
jpeg:
  static_qualities:
  - 70
  - 80
  - 90
  unseen_qualities:
  - 72
  - 78
  - 84
  - 88
  - 92
  dynamic_min: 70
  dynamic_max: 95
vf:
  quality_min: 70
  quality_max: 90
  max_model_order: 8
  fit_error_threshold: 0.15
  ratio_clip: 5.0
  amplitude_buckets:
  - 0.5
  - 1.5
  calibration_noise_scale: 0.35
  calibration_samples_per_image: 1
  fallback_interp: pchip
  stable_reflect: true
perceptual:
  alexnet_weights_path: ../data/perceptual/alexnet-owt-7be5be79.pth
  allow_weight_download: false
experiments:
  methods:
  - baseline_weak
  - baseline_strong
  - baseline_diffjpeg
  - vf_advjpeg
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  quality_suites:
    static_q70:
      attack_policy:
        kind: fixed
        quality: 70
      eval_policy:
        kind: fixed
        quality: 70
    static_q80:
      attack_policy:
        kind: fixed
        quality: 80
      eval_policy:
        kind: fixed
        quality: 80
    static_q90:
      attack_policy:
        kind: fixed
        quality: 90
      eval_policy:
        kind: fixed
        quality: 90
    dynamic_uniform:
      attack_policy:
        kind: random_uniform_int
        quality_min: 70
        quality_max: 95
      eval_policy:
        kind: random_uniform_int
        quality_min: 70
        quality_max: 95
analysis:
  study_id: reconfirm
  source_profile: r18_only
  baseline_method: baseline_strong
  candidate_method: vf_advjpeg
  main_suites:
  - static_q70
  - static_q80
  - static_q90
  - dynamic_uniform
  efficiency_targets:
    runtime_speedup_min: 3.0
    estimator_speedup_min: 3.0
    clean_drop_delta_max: 0.1
    asr_retention_min: 0.75
code_ocean:
  expected_metrics_path: assets/canonical_expected_metrics.json
  data_manifest_path: assets/data_assets_manifest.json
  environment_lock_path: assets/environment_lock.json
  paper_source_data_root: assets/paper_source_data
  headline_metrics_path: ../results/headline_metrics.json
  reproducibility_report_path: ../results/reproducibility_report.json
  run_manifest_path: ../results/run_manifest.json
  rebuild_from_paper_source_data: false
  generate_expanded_cpu_routes: true
  generate_pairwise_matrix: true
  expanded_cpu_routes:
    cifar10_standard:
      overrides:
      - configs/reviewer_cifar10.yaml
      seeds:
      - 42
      - 43
      - 44
    imagenet_modern_arch:
      overrides:
      - configs/reviewer_imagenet.yaml
      - configs/reviewer_imagenet_1000_cpu.yaml
      seeds:
      - 42
      - 43
      - 44
      - 45
      - 46
    cifar10_robustbench:
      overrides:
      - configs/reviewer_defended.yaml
      seeds:
      - 42
      - 43
      - 44
    budget_4_255:
      overrides:
      - configs/ei_cpu_reconfirm.yaml
      - configs/cpu_eps_4_255.yaml
      seeds:
      - 42
      - 43
      - 44
      - 45
      - 46
    budget_12_255:
      overrides:
      - configs/ei_cpu_reconfirm.yaml
      - configs/cpu_eps_12_255.yaml
      seeds:
      - 42
      - 43
      - 44
      - 45
      - 46
    structure_no_vf:
      overrides:
      - configs/ei_cpu_reconfirm.yaml
      - configs/cpu_structure_no_vf.yaml
      seeds:
      - 42
      - 43
      - 44
      - 45
      - 46
    structure_frequency_only:
      overrides:
      - configs/ei_cpu_reconfirm.yaml
      - configs/cpu_structure_frequency_only.yaml
      seeds:
      - 42
      - 43
      - 44
      - 45
      - 46
    structure_bucket_only:
      overrides:
      - configs/ei_cpu_reconfirm.yaml
      - configs/cpu_structure_bucket_only.yaml
      seeds:
      - 42
      - 43
      - 44
      - 45
      - 46
    structure_full_vf:
      overrides:
      - configs/ei_cpu_reconfirm.yaml
      - configs/cpu_structure_full_vf.yaml
      seeds:
      - 42
      - 43
      - 44
      - 45
      - 46
    quality_boundary:
      overrides:
      - configs/ei_cpu_reconfirm.yaml
      - configs/cpu_q50_q70_calibration.yaml
      seeds:
      - 42
      - 43
      - 44
      - 45
      - 46
  pairwise_routes:
    resnet18:
      override: configs/ei_cpu_matrix_resnet18.yaml
    vgg16:
      override: configs/ei_cpu_matrix_vgg16.yaml
    mobilenet_v2:
      override: configs/ei_cpu_matrix_mobilenet_v2.yaml
    densenet121:
      override: configs/ei_cpu_matrix_densenet121.yaml
